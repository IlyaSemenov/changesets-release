name: Publish
run-name: Publish ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Release commit
        required: true
        type: string

# One publication at a time; a new run waits for the running one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write # Push tags and create GitHub Releases.
  id-token: write # Publish to npm with trusted publishing.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.25

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install deps
        run: bun install --frozen-lockfile

      # This package is not its own dependency, so the workflow runs its build instead of `npx --no changesets-release ci`.
      # A release finds the publishing workflow by the text `changesets-release ci`, which this comment provides.
      - name: Publish
        run: bun run build && node dist/cli.mjs ci "$COMMIT"
        env:
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
